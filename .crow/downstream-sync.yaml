name: downstream-sync

when:
  - event: manual
    branch: main

skip_clone: true
variables:
  SOURCE_ARCHIVE: {default: ""}
  SOURCE_SHA256: {default: ""}
  UPSTREAM_SOURCE_BUNDLE: {default: ""}
  UPSTREAM_SOURCE_SHA256: {default: ""}
  RUST_TOOLCHAIN: {default: ""}
  CI_JOBS: {default: ""}
  CI_MIN_AVAILABLE_MB: {default: "8192"}
  CI_MEMORY_PER_JOB_MB: {default: "2048"}

steps:
  - name: merge-verify-publish
    image: bash
    environment:
      DOWNSTREAM_PUSH_KEY:
        from_secret: ccvl_downstream_push_key
      DOWNSTREAM_SSH_URL:
        from_secret: ccvl_downstream_ssh_url
      CARGO_PROFILE_DEV_DEBUG: "0"
    commands:
      - |
        set -euo pipefail
        test "$CI_REPO" = "corbet-libs/ccvl"
        test "$CI_COMMIT_BRANCH" = main
        test "$CI_COMMIT_BRANCH" = "$CI_REPO_DEFAULT_BRANCH"
        test -n "$SOURCE_ARCHIVE"
        test -n "$SOURCE_SHA256"
        printf '%s  %s\n' "$SOURCE_SHA256" "$SOURCE_ARCHIVE" | sha256sum --check --strict
        test "$(git get-tar-commit-id < "$SOURCE_ARCHIVE")" = "$CI_COMMIT_SHA"
        source_dir="$(mktemp -d)"
        trap 'rm -rf -- "$source_dir"' EXIT
        tar --extract --touch --no-same-owner --file "$SOURCE_ARCHIVE" --directory "$source_dir"
        cd "$source_dir"
        timeout --signal=TERM --kill-after=30s 45m \
          bash .agent/scripts/downstream-sync.sh "$CI_COMMIT_SHA"
