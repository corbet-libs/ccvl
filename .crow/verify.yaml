# Manual validation only. Native bundle publication has separate gates.
# SPDX-FileCopyrightText: 2026 Julian Y. Richard Corbet
# SPDX-License-Identifier: FSL-1.1-ALv2
when:
  - event: manual
skip_clone: true
variables:
  SOURCE_ARCHIVE:
    default: ""
  SOURCE_SHA256:
    default: ""
  CHECKS:
    default: rust
  RUST_TOOLCHAIN:
    default: "1.94.0"
  CARGO_TARGET_DIR:
    default: ""
steps:
  - name: verified-source
    image: bash
    commands:
      - |
        set -eu
        : "${SOURCE_ARCHIVE:?Set SOURCE_ARCHIVE to a staged git archive}"
        : "${SOURCE_SHA256:?Set SOURCE_SHA256 to its SHA-256}"
        printf '%s  %s\n' "$SOURCE_SHA256" "$SOURCE_ARCHIVE" | sha256sum --check --strict
        test "$(git get-tar-commit-id < "$SOURCE_ARCHIVE")" = "$CI_COMMIT_SHA"
        tar --extract --touch --file "$SOURCE_ARCHIVE" --no-same-owner
  - name: checks
    image: bash
    depends_on: [verified-source]
    environment:
      CARGO_BUILD_JOBS: "2"
      RUST_TEST_THREADS: "2"
    commands:
      - |
        set -eu
        case "$CHECKS" in
          rust|lint|documents) ;;
          *) echo 'Choose rust, lint, or documents' >&2; exit 2 ;;
        esac
        if [ -n "$CARGO_TARGET_DIR" ]; then
          mkdir -p "$CARGO_TARGET_DIR"
          exec flock --wait 60 "$CARGO_TARGET_DIR.ci.lock" timeout --kill-after=30s 45m bash .agent/scripts/ci-check.sh "$CHECKS"
        fi
        exec timeout --kill-after=30s 45m bash .agent/scripts/ci-check.sh "$CHECKS"
