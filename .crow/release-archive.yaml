name: release-archive
when:
  - event: manual
    branch: main
skip_clone: true
variables:
  SOURCE_ARCHIVE: {default: ""}
  SOURCE_SHA256: {default: ""}
  CCVL_RELEASE_DIR: {default: ""}
  ARCHIVE_EXECUTOR: {default: ""}
  ARCHIVE_EXECUTOR_SHA256: {default: ""}
steps:
  - name: verify-toolchain-free-bundle
    image: bash
    commands:
      - |
        set -eu
        test "$CI_REPO" = corbet-libs/ccvl
        test -n "$CCVL_RELEASE_DIR"
        printf '%s  %s\n' "$SOURCE_SHA256" "$SOURCE_ARCHIVE" | sha256sum --check --strict
        scratch="$(mktemp -d)"
        trap 'rm -rf -- "$scratch"' EXIT
        script="$scratch/check-release-archive.sh"
        tar -xOf "$SOURCE_ARCHIVE" .agent/scripts/check-release-archive.sh > "$script"
        if test -n "$ARCHIVE_EXECUTOR$ARCHIVE_EXECUTOR_SHA256"; then
          test -n "$ARCHIVE_EXECUTOR"
          [[ "$ARCHIVE_EXECUTOR_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test -f "$ARCHIVE_EXECUTOR"
          test ! -L "$ARCHIVE_EXECUTOR"
          cp -- "$ARCHIVE_EXECUTOR" "$scratch/executor"
          printf '%s  %s\n' "$ARCHIVE_EXECUTOR_SHA256" "$scratch/executor" | sha256sum --check --strict
          chmod 0700 "$scratch/executor"
          "$scratch/executor" "$script" "$CCVL_RELEASE_DIR"
        else
          bash "$script" "$CCVL_RELEASE_DIR"
        fi
