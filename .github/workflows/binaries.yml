name: Binaries

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Release binary (${{ matrix.os }} ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x86_64
            runner: ubuntu-24.04
            exe: ccvl
          - os: linux
            arch: aarch64
            runner: ubuntu-24.04-arm
            exe: ccvl
          - os: macos
            arch: arm64
            runner: macos-15
            exe: ccvl
          - os: macos
            arch: x86_64
            runner: macos-15-intel
            exe: ccvl
          - os: windows
            arch: x86_64
            runner: windows-2025
            exe: ccvl.exe
          - os: windows
            arch: arm64
            runner: windows-11-arm
            exe: ccvl.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      RUST_TOOLCHAIN: 1.94.0
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Check out the exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          test "$(rustc "+$RUST_TOOLCHAIN" --version | awk '{print $2}')" = "$RUST_TOOLCHAIN"

      - name: Reuse compiled dependencies
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          shared-key: release-${{ runner.os }}-${{ runner.arch }}
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the locked release binary once
        shell: bash
        run: cargo "+$RUST_TOOLCHAIN" build --locked --release

      - name: Verify the compiled runtime and public documents
        shell: bash
        run: |
          binary="$PWD/target/release/${{ matrix.exe }}"
          "$binary" public-check
          if [[ "${{ runner.os }}" != Windows ]]; then
            bash .agent/tests/test_runtime.sh "$binary"
          fi

      - name: Verify native Windows bootstrap and launcher
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & .\.agent\tests\test_runtime.ps1 -Binary "$PWD\target\release\ccvl.exe"

      - name: Package that exact binary with its workspace
        shell: bash
        run: |
          name="ccvl-${{ matrix.os }}-${{ matrix.arch }}"
          case "${{ matrix.exe }}" in *.exe) name="$name.exe" ;; esac
          bash .agent/scripts/package-release.sh "$name" "${{ matrix.exe }}" "$RUNNER_TEMP/dist"

      - name: Upload the verified platform package
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: ccvl-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
          retention-days: 3
