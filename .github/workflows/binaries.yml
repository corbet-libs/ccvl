name: Binaries

on:
  workflow_call:

permissions:
  contents: read

jobs:
  platforms:
    name: Resolve the explicit released platform set
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.platforms.outputs.matrix }}
    steps:
      - name: Check out the exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Map released platforms to native runners
        id: platforms
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import subprocess

          runners = {
              'linux-x86_64': 'ubuntu-24.04',
              'linux-aarch64': 'ubuntu-24.04-arm',
              'macos-arm64': 'macos-15',
              'macos-x86_64': 'macos-15-intel',
              'windows-x86_64': 'windows-2025',
              'windows-arm64': 'windows-11-arm',
          }
          platforms = subprocess.check_output(
              ['python3', '.agent/scripts/release-evidence.py', 'platforms'],
              text=True,
          ).splitlines()
          if not platforms:
              raise SystemExit('The released platform set must not be empty.')
          matrix = []
          for platform in platforms:
              os_name, arch = platform.rsplit('-', 1)
              matrix.append({'os': os_name, 'arch': arch, 'runner': runners[platform]})
          print('matrix=' + json.dumps({'include': matrix}, separators=(',', ':')))
          PY

  build:
    name: Release binary (${{ matrix.os }} ${{ matrix.arch }})
    needs: platforms
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platforms.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      RUST_TOOLCHAIN: stable
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Check out the exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install current stable Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup run "$RUST_TOOLCHAIN" rustc --version

      - name: Reuse compiled dependencies
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          shared-key: release-${{ runner.os }}-${{ runner.arch }}
          cache-bin: false
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build, verify and package the native release
        shell: bash
        run: bash .agent/scripts/native-release.sh "${{ matrix.os }}-${{ matrix.arch }}" "$RUNNER_TEMP/dist"

      - name: Upload the verified platform package
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: ccvl-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
          retention-days: 3
