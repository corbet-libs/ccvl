name: Skill evaluation

# Secret-bearing model evaluation belongs on a trusted internal worker.
# Keep the provider implementation as a reference; use the manual Crow skill-eval workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-eval-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: Small-model behavioural evaluation
    if: false # Hosted access to provider credentials is disabled.
    runs-on: [self-hosted, linux]
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false

      - name: Validate evaluator and skill contracts
        run: |
          source .agent/scripts/rust-toolchain.sh
          ccvl_select_rust_toolchain
          "${CCVL_CARGO_COMMAND[@]}" test --locked --all-features

      - name: Evaluate every skill with a small free model
        id: evaluation
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-20b
        run: |
          source .agent/scripts/rust-toolchain.sh
          ccvl_select_rust_toolchain
          set +e
          "${CCVL_CARGO_COMMAND[@]}" run --quiet --locked -- skill-eval \
            --cases .agent/tests/skill-cases.json \
            --skills-root .agent/skills \
            --output .agent/cache/ai-skill-eval/report.json \
            --summary "$GITHUB_STEP_SUMMARY"
          status=$?
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ai-skill-evaluation
          path: .agent/cache/ai-skill-eval/report.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Enforce evaluated result
        if: always()
        env:
          EVALUATION_EXIT_CODE: ${{ steps.evaluation.outputs.exit_code }}
        run: |
          case "$EVALUATION_EXIT_CODE" in
            0)
              echo "All semantic skill cases passed."
              ;;
            1)
              echo "::error::The model selected a forbidden action or missed a required action."
              exit 1
              ;;
            2)
              echo "::error::The evaluator input or configuration was invalid."
              exit 1
              ;;
            75)
              echo "::error::The free model provider was unavailable; no semantic pass is being claimed."
              exit 1
              ;;
            *)
              echo "::error::The skill evaluator was not configured or did not complete."
              exit 1
              ;;
          esac
