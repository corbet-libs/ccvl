name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.94.0

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Main includes publication, which must finish atomically.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  binaries:
    # Compiled bundles and publication are explicit release actions; all six native gates remain required.
    if: >-
      ${{ (github.repository == 'corbet-labs/ccvl') && (github.event_name == 'workflow_dispatch') }}
    uses: ./.github/workflows/binaries.yml

  rust-native:
    name: Native Rust compiler and document contracts
    if: github.repository == 'corbet-labs/ccvl'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false

      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" \
            --profile minimal \
            --component clippy,rustfmt
          test "$(rustc "+$RUST_TOOLCHAIN" --version | awk '{print $2}')" = "$RUST_TOOLCHAIN"

      - name: Reuse compiled test dependencies
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          shared-key: tests-linux-x86_64
          cache-bin: false
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting, locked tests and Clippy
        run: bash .agent/scripts/ci-check.sh rust

  lint:
    name: Workflow, shell, and license checks
    if: github.repository == 'corbet-labs/ccvl'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install lint tools
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          ACTIONLINT_VERSION: 1.7.12
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          mkdir -p "$RUNNER_TEMP/bin"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/bin" actionlint
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Check workflows and shell scripts
        run: |
          actionlint -shellcheck shellcheck
          shellcheck .agent/scripts/*.sh .agent/tests/*.sh ccvl

      - name: Check REUSE licensing
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  verify:
    name: Linux release and independent PDF verification
    # Compiled bundles and publication are explicit release actions; all six native gates remain required.
    if: >-
      ${{ (github.repository == 'corbet-labs/ccvl') && (github.event_name == 'workflow_dispatch') }}
    needs: [binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false

      - name: Download the tested Linux release package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: ccvl-linux-x86_64
          path: ${{ runner.temp }}/binary

      - name: Install the compiled runtime from this run
        run: |
          cd "$RUNNER_TEMP/binary"
          sha256sum --check ccvl-linux-x86_64.sha256
          mkdir -p "$GITHUB_WORKSPACE/.agent/cache/ccvl/bin"
          cp ccvl-linux-x86_64 "$GITHUB_WORKSPACE/.agent/cache/ccvl/bin/ccvl"
          chmod 0755 "$GITHUB_WORKSPACE/.agent/cache/ccvl/bin/ccvl"
          cd "$GITHUB_WORKSPACE"
          bash ./ccvl doctor

      - name: Install independent PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes file poppler-utils qpdf jq

      - name: Run Linux-specific independent PDF checks
        run: bash .agent/scripts/check-linux-deep.sh

      - name: Record tool versions
        if: always()
        run: |
          {
            echo "## Native runtime and independent verification"
            echo
            echo '```text'
            bash ./ccvl doctor
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  archive:
    name: Run the precompiled bundle without Git or Rust
    # Compiled bundles and publication are explicit release actions; all six native gates remain required.
    if: >-
      ${{ (github.repository == 'corbet-labs/ccvl') && (github.event_name == 'workflow_dispatch') }}
    needs: [binaries]
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 10
    steps:
      - name: Download the current Linux bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: ccvl-linux-x86_64
          path: /tmp/ccvl-dist

      - name: Verify the complete user download
        run: |
          cd /tmp/ccvl-dist
          sha256sum --check ccvl-linux-x86_64.tar.gz.sha256
          mkdir /tmp/ccvl-workspace
          tar -xzf ccvl-linux-x86_64.tar.gz -C /tmp/ccvl-workspace
          cd /tmp/ccvl-workspace
          test ! -e .git
          if command -v cargo || command -v rustc || command -v git; then
            echo 'The user bundle test must have no development toolchain.' >&2
            exit 1
          fi
          bash ./ccvl setup

  release:
    name: Publish all six verified platforms
    needs: [binaries, rust-native, lint, verify, archive]
    # Compiled bundles and publication are explicit release actions; all six native gates remain required.
    if: >-
      ${{ (github.repository == 'corbet-labs/ccvl' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request') && (github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out the exact source for publication
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download the verified packages from this run
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: ccvl-*
          path: ${{ runner.temp }}/release
          merge-multiple: true

      - name: Publish the complete matching runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .agent/scripts/publish-release.sh "$RUNNER_TEMP/release"
