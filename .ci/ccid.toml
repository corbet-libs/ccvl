schema = 1
project = "ccvl"

# Reuse suitable provisioned Rust and locked published dependencies.
# Native publication requires every platform receipt, including unavailable executors.

[checks.rust]
kind = "commands"
commands = [["bash", ".agent/scripts/ci-check.sh", "rust"]]

[checks.lint]
kind = "commands"
commands = [["bash", ".agent/scripts/ci-check.sh", "lint"]]

[checks.documents]
kind = "commands"
commands = [["bash", ".agent/scripts/ci-check.sh", "documents"]]

[checks.candidate-date]
kind = "commands"
commands = [["python3", ".agent/scripts/candidate-date.py"]]

[checks.downstream-check]
kind = "commands"
commands = [["python3", ".agent/scripts/downstream-check.py"]]

# Manual trusted workflow only; credentials are absent from the build step.
[checks.skill-eval-build]
kind = "commands"
commands = [["bash", ".agent/scripts/ci-check.sh", "skill-eval-build"]]

[checks.skill-eval]
kind = "commands"
commands = [["bash", ".agent/scripts/ci-check.sh", "skill-eval"]]

[checks.release-rust]
kind = "commands"
commands = [["bash", ".agent/scripts/ci-check.sh", "release-rust"]]

[checks.release-lint]
kind = "commands"
commands = [["bash", ".agent/scripts/ci-check.sh", "release-lint"]]

[checks.release-native]
kind = "commands"
commands = [["bash", ".agent/scripts/ci-check.sh", "release-native"]]

[checks.release-linux-deep]
kind = "commands"
commands = [["bash", ".agent/scripts/ci-check.sh", "release-linux-deep"]]

[checks.release-check]
kind = "commands"
commands = [["bash", ".agent/scripts/ci-check.sh", "release-check"]]

[checks.release-publish]
kind = "commands"
commands = [["bash", ".agent/scripts/ci-check.sh", "release-publish"]]

[checks.core-package]
kind = "commands"
commands = [["bash", ".agent/scripts/ci-check.sh", "core-package"]]

[checks.core-release]
kind = "commands"
commands = [["bash", ".agent/scripts/ci-check.sh", "rust", "lint", "core-package"]]
