version = 1

[[annotations]]
path = [
  ".agent/AGENT.md",
  ".agent/build.rs",
  ".agent/core/**",
  ".agent/release-platforms.txt",
  ".agent/scripts/**",
  ".agent/skills/**",
  ".agent/schemas/**",
  ".agent/src/**",
  ".agent/tests/**",
  ".agent/typst/**/*.toml",
  ".agent/typst/**/*.json",
  ".agent/typst/**/*.typ",
  ".agent/typst/letter/vendor/**",
  ".crow.yaml",
  ".github/workflows/**",
  ".gitattributes",
  ".gitignore",
  "AGENTS.md",
  "Cargo.lock",
  "Cargo.toml",
  "ccvl",
  "ccvl.cmd",
  "ccvl.json",
  "ccvl.ps1",
  "rust-toolchain.toml",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Julian Y. Richard Corbet"
SPDX-License-Identifier = "FSL-1.1-ALv2"

[[annotations]]
path = [
  ".agent/docs/**",
  ".agent/scaffolds/**",
  ".agent/typst/README.md",
  ".agent/typst/letter/README.md",
  ".github/CONTRIBUTING.md",
  ".github/SECURITY.md",
  "README.md",
  "cvl/**/README.md",
  "interview/**/README.md",
  "opportunities/README.md",
  "todo.md",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Julian Y. Richard Corbet"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["cvl/**/pdf/*.pdf", "cvl/**/preview/*.png"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Julian Y. Richard Corbet"
SPDX-License-Identifier = "LicenseRef-CCVL-Personal-Content"

[[annotations]]
path = [
  ".agent/docs/public-identifiers.md",
  ".agent/docs/showcase.md",
  ".agent/docs/signature.md",
  "cvl/profile.toml",
  "cvl/*/*/*/*/*/content.toml",
  "cvl/*/*/content/*/*/wording.toml",
  "cvl/cv/harvard/src/entries-*.typ",
  "cvl/assets/signature.png",
  "interview/stations.toml",
  ".agent/tests/fixtures/independent-styles/cvl/*/*/*/*/*/content.toml",
  ".agent/tests/fixtures/independent-styles/cvl/*/*/content/*/*/wording.toml",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Julian Y. Richard Corbet"
SPDX-License-Identifier = "LicenseRef-CCVL-Personal-Content"

[[annotations]]
path = [
  ".agent/typst/fonts/*.ttf",
  ".agent/typst/fonts/NOTICE.md",
  ".agent/typst/fonts/OFL-1.1.txt",
]
precedence = "override"
SPDX-FileCopyrightText = [
  "2014-2021 Adobe Systems Incorporated",
  "2017 The EB Garamond Project Authors",
  "2020 IBM Corp.",
  "2020 The Archivo Project Authors",
]
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = [
  "justfile",
  "cvl/shared/**",
  "cvl/*/*/style.toml",
  "cvl/*/*/layout.typ",
  "cvl/*/*/parts/*.typ",
  "cvl/*/*/*/*/*/layout.toml",
  "cvl/*/*/contract.toml",
  "cvl/*/*/scaffold.toml",
  "cvl/*/*/*/substyle.toml",
  "cvl/*/*/*/*/*/strings.toml",
  "cvl/*/*/*/*/*/typst/*.typ",
  "cvl/cv/harvard/src/cv.typ",
  "cvl/cl/harvard/src/cl.typ",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Julian Y. Richard Corbet"
SPDX-License-Identifier = "FSL-1.1-ALv2"

[[annotations]]
path = [
  ".agent/typst/letter/letter.typ",
  ".agent/typst/letter/generated/**",
  ".agent/typst/letter/vendor/**",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Julian Y. Richard Corbet"
SPDX-License-Identifier = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
