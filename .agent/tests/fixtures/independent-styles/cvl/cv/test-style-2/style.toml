id = "test-style-2"
api = 1
settings_adapter = "document-v1"
documents = ["cv"]
supports_locales = ["en-ch", "en-us"]
pages = [1, 2]
default_pages = 2
substyles = ["cards", "timeline"]
default_substyle = "cards"
defaults = "../../shared/test-style-2/defaults.toml"

[paper.defaults]
en-ch = "a4"
en-us = "us-letter"

[paper.sizes.a4]
size_pt = [841.8898, 595.2756]
label = "A4 / LANDSCAPE"

[paper.sizes.a4.settings.page]
paper = "a4"

[paper.sizes.us-letter]
size_pt = [792, 612]
label = "US-LETTER / LANDSCAPE"

[paper.sizes.us-letter.settings.page]
paper = "us-letter"
