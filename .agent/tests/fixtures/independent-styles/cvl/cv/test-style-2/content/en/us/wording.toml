# Shared CV wording for test-style-2, en-us.
# Reused only by substyles of this style.

[cv]
title = "One record. A different visual language."
intro = "This document demonstrates an independent style and a scoped substyle. It uses the approved workspace profile with explanatory test content."
[[cv.sections]]
title = "Identity and content"
body = "Profile fields supply the name and contact details. This style defines its own section fields; the demonstration makes no employment or achievement claims."
[[cv.sections]]
title = "Layout and hierarchy"
body = "The parent style owns geometry and typography. Its substyles rearrange the same content into visibly different compositions."
[[cv.sections]]
title = "Locale and paper"
body = "English does not imply US paper. The en-ch leaf explicitly selects A4; en-us explicitly selects US Letter. Both are rendered and verified."
[[cv.sections]]
title = "Checks and outputs"
body = "Every declared page preset has a PDF. Geometry, fonts, text extraction and reproducibility are checked against the selected style."
