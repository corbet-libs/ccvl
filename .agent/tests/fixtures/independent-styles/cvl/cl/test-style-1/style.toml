id = "test-style-1"
api = 1
settings_adapter = "document-v1"
documents = ["cl"]
supports_locales = ["en-ch", "en-us"]
pages = [1]
default_pages = 1
substyles = ["sidebar", "topbar"]
default_substyle = "sidebar"
defaults = "../../shared/test-style-1/defaults.toml"

[paper.defaults]
en-ch = "a4"
en-us = "us-letter"

[paper.sizes.a4]
size_pt = [595.2756, 841.8898]
label = "A4 / PORTRAIT"

[paper.sizes.a4.settings.page]
paper = "a4"

[paper.sizes.us-letter]
size_pt = [612, 792]
label = "US-LETTER / PORTRAIT"

[paper.sizes.us-letter.settings.page]
paper = "us-letter"
