# Synthetic ledger family settings: the document-v1 adapter baseline plus
# style-owned tables used by settings and substyle-delta tests.
id = "ledger"
api = 1

[page]
flipped = false
columns = 1
margin_top_mm = 12
margin_bottom_mm = 12
margin_left_mm = 15
margin_right_mm = 15
bleed_mm = 0
binding = "left"
fill = "auto"
header_ascent_percent = 30
footer_descent_percent = 30

[text]
font = "Archivo"
fallback = true
style = "normal"
weight = 400
stretch_percent = 100
size_pt = 10.5
fill = "#000000"
tracking_pt = 0
spacing_percent = 100
baseline_pt = 0
cjk_latin_spacing = "auto"
top_edge = "cap-height"
bottom_edge = "baseline"
direction = "ltr"
script = "auto"
hyphenate = "auto"
overhang = true
kerning = true
alternates = false
ligatures = true
discretionary_ligatures = false
historical_ligatures = false
number_type = "auto"
number_width = "auto"
slashed_zero = false
fractions = false
features = {}
variations = {}
smart_quotes = true
cost_hyphenation_percent = 100
cost_runt_percent = 100
cost_widow_percent = 100
cost_orphan_percent = 100

[paragraph]
leading_em = 0.7
spacing_pt = 0
justify = false
linebreaks = "auto"
first_line_indent_pt = 0
indent_all = false
hanging_indent_pt = 0
word_spacing_min_percent = 66.66666666666667
word_spacing_max_percent = 150
tracking_min_pt = 0
tracking_max_pt = 0

[block]
align = "left"
above_pt = 0
below_pt = 0
breakable = true

[accents]
link = "#1e3a5f"

[header]
after_pt = 6.3

[cv]
entry_spacing_pt = 12.0
bullet_indent_pt = 10.5

[cover]
rule_pt = 0
frame_pt = 0
