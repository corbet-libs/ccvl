# Neutral opportunity record. The selected styles supply page defaults and blank content fields.
#
# Template shape: new-opportunity strips the position-prose fields below into
# the sibling posting.md (the one human-readable position reference) and keeps
# only the role identity plus the document build here. Mechanical header
# (schema_version, revision, id) is managed, not hand-edited.

schema_version = 4
revision = 0

[options]
language = ""
generate_cl = true
# Quoted YYYY-MM-DD or YYYY-MM; empty deliberately omits the date.
application_date = ""

[job]
id = ""
title = ""
organization = ""
location = ""
source = ""
url = ""
description = ""
connections = ""
company_context = ""
notes = ""

[job.cl_recipient]
# Full address form for the locale-correct salutation, e.g. "Frau Dr. Müller"
# or "Herr Müller" (see .agent/docs/cover-letter.md). Empty uses the generic
# salutation and warns; the address itself is recorded but never printed.
# Optional: salutation_override holds a complete explicitly requested
# salutation line as printed (e.g. a spaced double surname the last-token
# renderer would shorten). Empty or absent falls back to the name-derived
# salutation. It must already carry the locale-correct punctuation.
name = ""
title = ""
company = ""
address_line_1 = ""
address_line_2 = ""
# salutation_override = ""
