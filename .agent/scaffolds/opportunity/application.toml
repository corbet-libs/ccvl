# New opportunity scaffold. Fill every field; empty text fails the gate.
# Summary is one flowing paragraph (must typeset to exactly 5 lines).
# Highlights are written before the paragraphs but render between 3 and 4.

schema_version = 4
revision = 0

[options]
language = ""
pages = 4
generate_cl = true
application_date = ""
# Render style: one entry from the `styles` section in ccvl.json.
style = "harvard"

[job]
id = ""
title = ""
organization = ""
location = ""
source = ""
url = ""
description = ""
connections = ""
company_context = ""
notes = ""

[job.cl_recipient]
# Full address form for the locale-correct salutation, e.g. "Frau Dr. Müller"
# or "Herr Müller" (see .agent/docs/cover-letter.md). Empty uses the generic
# salutation and warns; the address itself is recorded but never printed.
name = ""
title = ""
company = ""
address_line_1 = ""
address_line_2 = ""

[cv]
# allow_thin keeps an explicitly wanted thin line green; thin lines fail otherwise.
allow_thin = false
summary = """"""

[cl]
highlights = [
  "",
  "",
  "",
  "",
  "",
]

paragraphs = [
  ["", "", ""],
  ["", "", "", "", "", ""],
  ["", "", "", "", "", ""],
  ["", "", "", "", ""],
  ["", "", "", "", ""],
  ["", "", ""],
]
