# Explicit Harvard presentation settings; locale layout overrides are applied last.
id = "harvard"
api = 1

[page]
paper = "a4"
flipped = false
columns = 1
margin_top_mm = 12
margin_bottom_mm = 12
margin_left_mm = 15
margin_right_mm = 15
bleed_mm = 0
binding = "left"
fill = "auto"
header_ascent_percent = 30
footer_descent_percent = 30

[text]
font = "Archivo"
fallback = true
style = "normal"
weight = 400
stretch_percent = 100
size_pt = 10.5
fill = "#000000"
tracking_pt = 0
spacing_percent = 100
baseline_pt = 0
cjk_latin_spacing = "auto"
top_edge = "cap-height"
bottom_edge = "baseline"
direction = "ltr"
script = "auto"
hyphenate = "auto"
overhang = true
kerning = true
alternates = false
ligatures = true
discretionary_ligatures = false
historical_ligatures = false
number_type = "auto"
number_width = "auto"
slashed_zero = false
fractions = false
features = {}
variations = {}
smart_quotes = true
cost_hyphenation_percent = 100
cost_runt_percent = 100
cost_widow_percent = 100
cost_orphan_percent = 100

[paragraph]
leading_em = 0.7
spacing_pt = 0
justify = false
linebreaks = "auto"
first_line_indent_pt = 0
indent_all = false
hanging_indent_pt = 0
word_spacing_min_percent = 66.66666666666667
word_spacing_max_percent = 150
tracking_min_pt = 0
tracking_max_pt = 0

[block]
align = "left"
above_pt = 0
below_pt = 0
breakable = true

[accents]
link = "#1e3a5f"
highlight_background = "#f8fafc"

[header]
after_pt = 6.3

[cv]
superheading_outer_spacing_pt = 17.85
compact_heading_spacing_pt = 9.45
spacious_heading_spacing_pt = 19.35
entry_spacing_pt = 11.75
heading_after_pt = 6.3
subheading_after_pt = 7.35
bullet_after_pt = 8.4
competency_heading_after_pt = 7.35
rule_gap_pt = 4.41
superheading_inner_pt = 5.25
bullet_indent_pt = 10.5

[cover]
# Header/subject, salutation, body, highlight panel, body, and farewell gaps.
# Normalize these weights over the free page height; every gap keeps its bounds.
gap_weights = [0.8, 0.8, 0.9, 1.05, 1.05, 1.1, 1.1, 1.05, 1.05, 0.9]
subject_after_pt = 4.41
highlight_inset_pt = 8
# Match CV bullet spacing: roughly half a text line between highlight rows.
highlight_gap_pt = 8.4
closing_before_pt = 5.25
closing_after_pt = 2
