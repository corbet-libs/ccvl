# Harvard cover-letter family: the default. Registry for the cover-letter
# substyle axis: substyles lists every position in order and the first renders
# when a record selects nothing. empty_substyles are slots without a design.
id = "harvard"
api = 1
settings_adapter = "document-v1"
documents = ["cl"]
supports_locales = ["de-ch", "en-ch"]
pages = [1]
substyles = ["left-rule", "frame", "slot-3", "slot-4", "slot-5"]
empty_substyles = ["slot-3", "slot-4", "slot-5"]
default_pages = 1
defaults = "../../shared/harvard/defaults.toml"

[paper.defaults]
de-ch = "a4"
en-ch = "a4"

[paper.sizes.a4]
size_pt = [595.2756, 841.8898]
label = "A4"

[paper.sizes.a4.settings.page]
paper = "a4"
