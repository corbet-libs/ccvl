# Harvard cover-letter family: the default. Registry for the cover-letter
# substyle axis: substyles lists every cvl/cl/harvard/<name>/substyle.toml,
# default_substyle renders when a record selects nothing.
id = "harvard"
api = 1
settings_adapter = "document-v1"
documents = ["cl"]
supports_locales = ["de-ch", "en-ch"]
pages = [1]
default_substyle = "left-rule"
substyles = ["left-rule", "frame"]
default_pages = 1
defaults = "../../shared/harvard/defaults.toml"

[paper.defaults]
de-ch = "a4"
en-ch = "a4"

[paper.sizes.a4]
size_pt = [595.2756, 841.8898]
label = "A4"

[paper.sizes.a4.settings.page]
paper = "a4"
