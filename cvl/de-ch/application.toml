[options]
language = "de-ch"
pages = 4
generate_cl = true
application_date = "September 2026"
# Render style: "harvard" (default) or another entry from the `styles`
# section in ccvl.json. Records without this field render as harvard.
style = "harvard"

[job]
id = "showcase-de-ch"
title = "Innovation, Technologie & Strategie"
organization = ""
location = "Schweiz | hybrid | remote"
source = "ccvl showcase"
url = "https://github.com/corbet-labs/ccvl"
description = "Aufgaben an der Schnittstelle von Innovationsmanagement, Technologie, Strategie und Finance."
connections = ""
company_context = "Target-neutrales, öffentliches Arbeitsbeispiel und offene Bewerbung."
notes = "Der Inhalt beschreibt Julian Corbet; neue Nutzer ersetzen ihn ausschliesslich mit eigenen belegten Fakten."

[job.cl_recipient]
name = ""
title = ""
company = ""
address_line_1 = ""
address_line_2 = ""

[cv]
# One flowing paragraph. It must typeset to exactly 5 lines; the checker
# verifies instead of you counting. (The fifth sentence exposes the adaptation
# formula for new users; a real application rewrites it target-specifically.)
summary = """Dieses CV ist Arbeitsbeispiel, technische Produktdemonstration und offene Bewerbung zugleich und verbindet Technologie- und Innovationsmanagement mit Strategie und Finance. Belegt durch GenAI und RAG-Suche im Hause CENVION, Entscheidungsanalysen für Swisscom und Airbus sowie M&A, Banking und Beratung in vier Märkten. Passt das Profil, lassen Sie uns sprechen – gern über Ihre Mandate, Ziele und offenen Fragen. Anleitung für den eigenen CV: Zielprofil | Differenzierung | zwei belegte Resultate | klarer Mehrwert für Ihr Team."""

[cl]
# Five one-line highlights. Written first, rendered between paragraphs 3 and 4.
highlights = [
  "Innovation & Technologie | Agentic AI, Cloud-Systeme und 50+ Open-Source-Projekte",
  "Applied AI & Data | RAG-Suche, ML-Risikoanalysen und intelligente Automatisierung",
  "Strategie & Transformation | SteerCo-Entscheidungen, TOM und operative Umsetzung",
  "Finance & Investment | Projektfinanzierung, DCF, Portfolio- und Szenarioanalysen",
  "Unternehmerische Umsetzung | Beratung in vier Märkten und Projekt-P&L aus einer Hand",
]

# Six paragraphs, one array of lines each.
paragraphs = [
  [
    "Ich suche eine Aufgabe, die Innovationsmanagement und Technologie mit Strategie und Finance verbindet.",
    "Die Praxisbeispiele zeigen, wie ich diese Disziplinen in Investmentanalysen, Infrastruktur und angewandter KI",
    "zusammenbringe. ccvl dient zugleich als Produktdemo: So strukturiere, messe und prüfe ich Bewerbungen.",
  ],
  [
    "Bei CENVION führte ich Claude und eine RAG-basierte Suche in Investment- und Reporting-Workflows ein.",
    "Für sieben Batteriespeicher modellierte ich IRR, NPV, DSCR und Sensitivitäten für Refinanzierungspakete",
    "und Entscheidungen institutioneller Investoren und automatisierte die Datenstrecke von den Betriebsdaten",
    "bis zu Quartalsberichten, die Performance-Lücken und operative Optimierungshebel direkt sichtbar machte.",
    "Damit verband ich neue Technologie mit Kapitalentscheidungen, Risikotransparenz und Portfolioblick.",
  ],
  [
    "Bei Airbus übersetzte ich mehr als 20 Jahre sicherheitskritische Wartungsdaten von über 500 Flugzeugen in",
    "entscheidungsreife Risiko- und Kostensignale mit über EUR 100'000 an jährlichem Sparpotenzial und stiess",
    "ein internationales Verbesserungsprogramm von über EUR 1 Mio. an. Bei Swisscom modellierte ich danach",
    "Cloud-Ökonomie und Infrastrukturentscheide unter Rechenzentrumsgrenzen für achtstellige Investitionen",
    "und Lieferantenverhandlungen über CHF 10 Mio.; der rote Faden bleibt gemeinsam nutzbare Evidenz.",
  ],
  [
    "Meine Erfahrung verbindet technische Umsetzung mit Investmentanalysen und den Entscheidungen auf dem",
    "Weg von einer Idee zur Umsetzung. Ich kann einen Prototypen selbst bauen, seine technische Tragfähigkeit",
    "prüfen und erklären, welches Problem er löst. Auf dieser Grundlage bespreche ich den Business Case und die",
    "Entscheidungsrisiken mit den Verantwortlichen. So verbinde ich Technologie, Strategie und Finance zu einer",
    "gemeinsamen Entscheidungsgrundlage, die für Führungskräfte verständlich und für Fachleute belastbar bleibt.",
  ],
  [
    "In einer konkreten Bewerbung verbindet dieser Absatz eine Strategie, Initiative oder Aufgabe der Organisation",
    "mit den genannten Erfahrungen. Er erklärt anhand der Recherche, was mich an der Aufgabe anspricht und",
    "welchen Beitrag ich leisten könnte. Diese öffentliche Version lässt die Auswahl frei: Mich interessieren Teams,",
    "die Innovation praktisch umsetzen und wirtschaftlich einordnen wollen. Wenn Sie eine Technologieinvestition",
    "abwägen oder eine Idee in die Umsetzung bringen, bietet diese Verbindung eine Grundlage für das Gespräch.",
  ],
  [
    "Wenn Ihr Projekt oder eine offene Stelle zu diesem Profil passt, senden Sie mir eine kurze Beschreibung und",
    "schlagen Sie einen Termin vor. Wir können dann besprechen, welche Entscheidung ansteht und wie meine",
    "Erfahrung dabei hilft. Vielen Dank für Ihr Interesse; ich freue mich darauf, Ihre Aufgabe kennenzulernen.",
  ],
]
