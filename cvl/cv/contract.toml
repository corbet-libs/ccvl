# Harvard CV contract: the frozen measurement and layout budgets every CV
# substyle (standard, compact) satisfies. Moved from ccvl.json documents.cv;
# the engine reads this file instead of the manifest.

id = "harvard"
api = 1
presets = [2, 3, 4]
summary_lines = 5
last_line_maximum = 102

[summary_fill]
minimum = 95
target = 97
maximum = 100

[layout_contract]
definition = "A station, project, or competency block is one full CV entry with its own heading and supporting content. Compact standalone lines do not count."
verified_only = true
unique_fact_assignment = true

[layout_contract.page_1.entries]
minimum = 6
target = 7
maximum = 8

[layout_contract.page_2]
entries = 10
bullets_per_entry = 2

[layout_contract.page_3]
entries = 10
bullets_per_entry = 2

[layout_contract.page_4]
groups = 3
entries_per_group = 3
bullets_per_entry = 3
