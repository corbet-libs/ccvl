id = "cluster"
api = 1
settings_adapter = "document-v1"
documents = ["cv"]
supports_locales = ["de-ch", "en-ch"]
pages = [1]
default_pages = 1
substyles = ["standard", "middle-three", "middle-three-spaced", "d-plus"]
default_substyle = "d-plus"
defaults = "../../shared/cluster/defaults.toml"

[paper.defaults]
de-ch = "a4"
en-ch = "a4"

[paper.sizes.a4]
size_pt = [595.2756, 841.8898]
label = "A4"

[paper.sizes.a4.settings.page]
paper = "a4"
