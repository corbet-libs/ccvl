# Neutral opportunity record. The selected styles supply page defaults and blank content fields.

schema_version = 4
revision = 0

[options]
language = "en-ch"
pages = 2
cl_pages = 2
cv_style = "test-style-2"
cl_style = "test-style-2"
cv_substyle = "cards"
cl_substyle = "cards"
generate_cl = true
application_date = ""

[job]
id = "demo-test-style-2-cards-en-ch"
title = ""
organization = ""
location = ""
source = ""
url = ""
description = ""
connections = ""
company_context = ""
notes = ""

[job.cl_recipient]
# Full address form for the locale-correct salutation, e.g. "Frau Dr. Müller"
# or "Herr Müller" (see .agent/docs/cover-letter.md). Empty uses the generic
# salutation and warns; the address itself is recorded but never printed.
name = ""
title = ""
company = ""
address_line_1 = ""
address_line_2 = ""

[cv]
title = "One record. A different visual language."
intro = "This document demonstrates an independent style and a scoped substyle. It uses the approved workspace profile with explanatory test content."
[[cv.sections]]
title = "Identity and content"
body = "Profile fields supply the name and contact details. This style defines its own section fields; the demonstration makes no employment or achievement claims."
[[cv.sections]]
title = "Layout and hierarchy"
body = "The parent style owns geometry and typography. Its substyles rearrange the same content into visibly different compositions."
[[cv.sections]]
title = "Locale and paper"
body = "English does not imply US paper. The en-ch leaf explicitly selects A4; en-us explicitly selects US Letter. Both are rendered and verified."
[[cv.sections]]
title = "Checks and outputs"
body = "Every declared page preset has a PDF. Geometry, fonts, text extraction and reproducibility are checked against the selected style."
[cl]
subject = "An independent cover-letter composition"
opening = "This is demonstration text for comparing styles and substyles."
body = ["The letter uses the same approved profile and common record envelope as the CV. Its content fields and arrangement belong to the selected letter style.", "The layout file explicitly chooses paper size, orientation, language and region. Font, spacing and text-shaping choices are recorded in the style settings.", "Switch the substyle to compare the arrangement while keeping the content constant. A style may use any geometry its renderer and declared page presets support."]
closing = "Demonstration complete. This document is not a job application."
