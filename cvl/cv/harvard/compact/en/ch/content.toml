schema_version = 4
revision = 0

[options]
cv_style = "harvard"
language = "en-ch"
pages = 4
generate_cl = true
application_date = "September 2026"
# Render look: one entry of cvl/cv/harvard/style.toml substyles. This leaf is the
# compact CV; records without the field render as standard.
cv_substyle = "compact"

[job]
id = "showcase-en-ch"
title = "Innovation, Technology & Strategy"
organization = ""
location = "Switzerland | hybrid | remote"
source = "ccvl showcase"
url = "https://github.com/corbet-labs/ccvl"
description = "Roles at the intersection of innovation management, technology, strategy and finance."
connections = ""
company_context = "Target-neutral public working example and open application."
notes = "The content describes Julian Corbet; new users replace it only with their own evidenced facts."

[job.cl_recipient]
name = ""
title = ""
company = ""
address_line_1 = ""
address_line_2 = ""

[cv]
# One flowing paragraph. It must typeset to exactly 5 lines; the checker
# verifies instead of you counting. (The fifth sentence exposes the adaptation
# formula for new users; a real application rewrites it target-specifically.)
summary = """This CV is working example, technical product demonstration and open application combining technology and innovation management with strategy and finance in regulated environments. Evidence: GenAI and RAG search at CENVION, decision analysis for Swisscom and Airbus including M&A, banking-sector and consulting across four markets. If that fits, let us speak – gladly about your mandates, goals and open questions across Switzerland or remote. To adapt it: target profile | differentiation | two evidenced results | clear value for your team."""

[cl]
# Five one-line highlights. Written first, rendered between paragraphs 3 and 4.
highlights = [
  "Innovation & Technology | Agentic AI, cloud systems and 50+ open-source projects",
  "Applied AI & Data | RAG search, ML risk analysis and automated investment reporting",
  "Strategy & Transformation | SteerCo decisions, TOM and operational delivery",
  "Finance & Investment | Project-finance models, DCF, portfolio and scenario analysis",
  "Entrepreneurial Delivery | Consulting across four markets and end-to-end project P&L",
]

# Six paragraphs, one array of lines each.
paragraphs = [
  [
    "I am looking for a role connecting innovation management and technology with strategy and corporate finance.",
    "The examples below show how I bring these disciplines together in investment analysis, infrastructure and",
    "applied AI. ccvl is also a working demonstration of how I structure, measure and review applications.",
  ],
  [
    "At CENVION, I introduced Claude and RAG-based search into the team's investment and reporting workflows.",
    "For seven battery-storage assets, I modelled IRR, NPV, DSCR and sensitivities to support their refinancing",
    "packages and investment decisions for institutional investors, and automated the data flow from operating data",
    "to quarterly reports, making performance gaps and opportunities for operational improvement easier to identify.",
    "That tied emerging technology to capital decisions, risk transparency and a dependable portfolio view.",
  ],
  [
    "At Airbus, I translated more than 20 years of safety-critical maintenance data covering more than 500 aircraft",
    "into decision-ready risk and cost signals, identifying over EUR 100k in potential annual savings and helping",
    "trigger an international improvement programme worth more than EUR 1m. At Swisscom, I then modelled the",
    "cloud economics and infrastructure choices under data-centre constraints, supporting eight-figure investments",
    "and supplier negotiations exceeding CHF 10m. Both gave leaders and specialists a shared decision base.",
  ],
  [
    "My experience connects technical implementation with investment analysis and the decisions that turn ideas",
    "into delivery. I can build a prototype myself, test its technical viability and explain the problem it solves. This",
    "technical understanding informs the business case and the risks I discuss with the people responsible for the",
    "decision. I bring technology, strategy and finance into a shared decision base, helping leaders and specialists",
    "assess the same evidence, compare their options and understand what execution will require.",
  ],
  [
    "In a tailored application, this paragraph links a specific company strategy, initiative or challenge to the evidence",
    "above. It explains why the opportunity interests me and where my experience would be relevant, drawing on",
    "research into the organisation's needs. This public version leaves that choice open: I am interested in teams",
    "that want to implement innovation and assess commercial value. If you are weighing a technology investment",
    "or moving an idea towards delivery, that combination offers a useful basis for discussion.",
  ],
  [
    "If a project or role calls for this combination, send me a short outline by email and suggest a time to speak. We",
    "can use a first conversation to discuss the decision you face, the work involved and how my experience could",
    "help. Thank you for considering this open application; I would welcome the chance to discuss your priorities.",
  ],
]
