# Harvard CV contract: the frozen measurement and layout budgets every CV
# substyle (standard, compact) satisfies. Moved from ccvl.json documents.cv;
# the engine reads this file instead of the manifest.

id = "harvard"
api = 1
content_fields = ["summary", "allow_thin"]
shared_pages = [1, 2]
source_files = ["src/entries-de.typ", "src/entries-en.typ"]
presets = [2, 3, 4]
summary_lines = 5
last_line_maximum = 102

[summary_fill]
minimum = 95
target = 97
maximum = 100

[layout_contract]
definition = "A station, project, or competency block is one full CV entry with its own heading and supporting content. Compact standalone lines do not count."
verified_only = true
unique_fact_assignment = true

[layout_contract.page_1.entries]
minimum = 6
target = 7
maximum = 8

[layout_contract.page_2]
entries = 10
bullets_per_entry = 2

[layout_contract.page_3]
entries = 10
bullets_per_entry = 2

[layout_contract.page_4]
groups = 3
entries_per_group = 3
bullets_per_entry = 3

[pdf]
size_pt = [595.2756, 841.8898]
font_pattern = "^[A-Z]{6}\\+Archivo-(Bold|Italic|Medium|Regular)$"
required_profile_fields = ["name", "email", "phone_label"]
minimum_text_chars = 100

[[metric_rules]]
kind = "cv-summary"
minimum = 5
maximum = 5

[[metric_rules]]
kind = "cv-heading"
minimum = 1

[[metric_rules]]
kind = "cv-subheading"
minimum = 1

[[metric_rules]]
kind = "cv-bullet"
minimum = 1
